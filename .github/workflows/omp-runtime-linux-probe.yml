# Linux-hosted probe of the lockfile-pinned OMP 17.3.5 Host Event path.
#
# Uses the existing frozen-tarball live cell (drive.mjs loopback + packed
# Plugin). Not certification: no ledger write, no bot PR, no `certified`.
# Nonzero exit on blocked/failed is evidence, not cloud viability.
name: omp-runtime-linux-probe

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: omp-runtime-linux-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Frozen-tarball Host Event live cell on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and pack the Plugin subject
        run: |
          set -euo pipefail
          pnpm --filter @kunolu/omp-sbtd build
          mkdir -p "${RUNNER_TEMP}/omp-probe-pack"
          pnpm --filter @kunolu/omp-sbtd pack --pack-destination "${RUNNER_TEMP}/omp-probe-pack"

      - name: Run frozen-tarball Host Event live cell
        env:
          SPIKE_OMP_BIN: ${{ github.workspace }}/packages/omp-sbtd/node_modules/@oh-my-pi/pi-coding-agent/dist/cli.js
          HOST_EVENT_PLUGIN_TARBALL: ${{ runner.temp }}/omp-probe-pack/kunolu-omp-sbtd-0.1.0-rc.13.tgz
          HOST_EVENT_RUNS_ROOT: ${{ runner.temp }}/host-event-runs
          HOST_EVENT_TARGET_VERSION: "17.3.5"
        run: pnpm --filter @kunolu/omp-sbtd exec tsx scripts/p0/host-event/run-live-cell.ts
