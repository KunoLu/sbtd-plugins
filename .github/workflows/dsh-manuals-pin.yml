# Independent dsh manuals pin gate (not omp-*).
# MANIFEST SHA + scripts/sync-manuals.sh must fail red.
# Pin is 640-skills 1.0.15 / bc8eec1549928fb0966254751b96b611b6334183
# (not a local 640-skills tip). Does not install @deepseek-ai/dsh.
name: dsh-manuals-pin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/dsh-sbtd/manuals/**"
      - "packages/dsh-sbtd/scripts/sync-manuals.sh"
      - "packages/dsh-sbtd/test/t4-manuals.test.mjs"
      - "packages/dsh-sbtd/test/t4-sync-exit.test.mjs"
      - ".github/workflows/dsh-manuals-pin.yml"
      - "docs/assets/dsh/ci-640-skills-adapt.md"

permissions: {}

concurrency:
  group: dsh-manuals-pin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: MANIFEST SHA + sync-manuals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Assert MANIFEST pin (not a local tip)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pin_rev = "bc8eec1549928fb0966254751b96b611b6334183"
          pin_ver = "1.0.15"
          manifest = json.loads(Path("packages/dsh-sbtd/manuals/MANIFEST.json").read_text(encoding="utf-8"))
          script = Path("packages/dsh-sbtd/scripts/sync-manuals.sh").read_text(encoding="utf-8")
          assert manifest["source"] == "KunoLu/640-skills", manifest["source"]
          assert manifest["version"] == pin_ver, manifest["version"]
          assert manifest["sourceRevision"] == pin_rev, manifest["sourceRevision"]
          assert f'PINNED_REVISION="{pin_rev}"' in script
          assert f'PINNED_VERSION="{pin_ver}"' in script
          print(f"MANIFEST pin ok {manifest['version']} {manifest['sourceRevision']}")
          PY

      - name: t4 manuals tests (no dsh registry)
        run: node --test packages/dsh-sbtd/test/t4-manuals.test.mjs packages/dsh-sbtd/test/t4-sync-exit.test.mjs

      - name: sync-manuals.sh against cloned pin (fail red)
        run: |
          set -euo pipefail
          pin="bc8eec1549928fb0966254751b96b611b6334183"
          clone="${RUNNER_TEMP}/640-skills"
          git clone --filter=blob:none --no-checkout https://github.com/KunoLu/640-skills.git "${clone}"
          git -C "${clone}" fetch --depth=1 origin "${pin}"
          git -C "${clone}" checkout --detach "${pin}"
          bash packages/dsh-sbtd/scripts/sync-manuals.sh "${clone}"
          git diff --exit-code -- packages/dsh-sbtd/manuals
