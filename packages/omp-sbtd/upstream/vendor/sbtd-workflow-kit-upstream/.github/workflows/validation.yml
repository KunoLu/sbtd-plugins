name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.VALIDATION_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install declared Onboard dependencies
        run: python -m pip install -r sbtd-workflow-onboard/requirements.txt

      - name: Prepare Python bytecode before source snapshots
        run: python -m compileall -q sbtd-workflow-onboard/scripts tests

      - name: Check installer syntax
        if: matrix.shard == 1
        run: bash -n install.sh

      - name: Run disjoint full-suite shard
        run: >-
          python -B tests/run_ci.py --platform linux
          --shard ${{ matrix.shard }} --shards 3
          --output "${{ runner.temp }}/validation"

      - name: Verify minimum supported TOML editor
        if: matrix.shard == 1
        run: |
          python -m pip install 'tomlkit==0.13.2'
          python -B -m unittest tests.test_sbtd_codex_wiring tests.test_sbtd_followup_section_gate

      - name: Preserve native results and Chinese summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.shard }}-${{ env.VALIDATION_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
          if-no-files-found: error

      - name: Verify the checkout stayed clean
        run: test -z "$(git status --porcelain)"

  linux-full:
    needs: linux-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Linux shard and compatibility check
        env:
          RESULT: ${{ needs.linux-shards.result }}
        run: test "$RESULT" = success
      - name: Set up Python for report verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.VALIDATION_SHA }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-*-${{ env.VALIDATION_SHA }}-attempt-*
          path: ${{ runner.temp }}/validation
          merge-multiple: false
      - name: Prove complete non-overlapping Linux coverage
        run: >-
          python -B tests/run_ci.py --platform linux --shards 3
          --output "${{ runner.temp }}/validation" --verify-reports

  macos-bash-installer:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.VALIDATION_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install declared Onboard dependencies
        run: python -m pip install -r sbtd-workflow-onboard/requirements.txt

      - name: Check Python and installer syntax
        run: |
          python -m compileall -q sbtd-workflow-onboard/scripts tests
          /bin/bash -n install.sh

      - name: Run native macOS suite without repeated selectors
        run: >-
          python -B tests/run_ci.py --platform macos
          --output "${{ runner.temp }}/validation"

      - name: Preserve native results and Chinese summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ env.VALIDATION_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
          if-no-files-found: error

      - name: Verify the checkout stayed clean
        run: test -z "$(git status --porcelain)"

  windows-shards:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.VALIDATION_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install declared Onboard dependencies
        run: python -m pip install -r sbtd-workflow-onboard/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q sbtd-workflow-onboard/scripts tests

      - name: Run disjoint native Windows shard
        run: >-
          python -B tests/run_ci.py --platform windows
          --shard ${{ matrix.shard }} --shards 4
          --output "${{ runner.temp }}/validation"

      - name: Preserve native results and Chinese summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.shard }}-${{ env.VALIDATION_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
          if-no-files-found: error

      - name: Verify the checkout stayed clean
        run: test -z "$(git status --porcelain)"

  windows-powershell-installer:
    needs: windows-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every native Windows shard
        env:
          RESULT: ${{ needs.windows-shards.result }}
        run: test "$RESULT" = success
      - name: Set up Python for report verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.VALIDATION_SHA }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-*-${{ env.VALIDATION_SHA }}-attempt-*
          path: ${{ runner.temp }}/validation
          merge-multiple: false
      - name: Prove complete non-overlapping Windows coverage
        run: >-
          python -B tests/run_ci.py --platform windows --shards 4
          --output "${{ runner.temp }}/validation" --verify-reports
